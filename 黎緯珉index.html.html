
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棒球比賽計分板</title>

<style>
:root {
  --navy: #12334a;
  --green: #087f77;
  --orange: #e9a23b;
  --red: #ad3f36;
  --white: #f6f8f5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #071b29;
  color: var(--white);
  font-family: Arial, "Microsoft JhengHei", sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

h1 { text-align: center; font-size: 32px; }
h2 { margin-top: 0; font-size: 22px; }

.panel {
  background: var(--navy);
  padding: 22px;
  border-radius: 16px;
  border: 1px solid #36566a;
  margin-bottom: 16px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.inning {
  text-align: center;
  color: var(--orange);
  font-size: 28px;
  font-weight: bold;
  margin: 12px 0 22px;
}

.team {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #456073;
  padding: 12px 0;
  gap: 12px;
  font-size: 25px;
}

.score {
  font-size: 54px;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

.batting {
  color: var(--orange);
  font-weight: bold;
  margin-top: 16px;
}

.count-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 22px 0;
  font-size: 21px;
}

.lights { display: flex; gap: 9px; }

.light {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  background: #415c6a;
  border: 2px solid #81939b;
}

.ball.on { background: #19b6a4; }
.strike.on { background: var(--orange); }
.out.on { background: #f05c55; }

.diamond {
  position: relative;
  width: 250px;
  height: 230px;
  margin: 15px auto;
}

.base {
  position: absolute;
  width: 62px;
  height: 62px;
  border: 3px solid white;
  background: #425c6b;
  color: white;
  transform: rotate(45deg);
  cursor: pointer;
  border-radius: 5px;
}

.base span {
  display: block;
  transform: rotate(-45deg);
  font-size: 15px;
  font-weight: bold;
}

.base.active {
  background: var(--orange);
  color: #172e40;
}

.first { top: 90px; right: 10px; }
.second { top: 10px; left: 94px; }
.third { top: 90px; left: 10px; }

.homeplate {
  position: absolute;
  bottom: 0;
  left: 94px;
  width: 62px;
  height: 48px;
  background: white;
  color: #12334a;
  text-align: center;
  padding-top: 9px;
  font-weight: bold;
  clip-path: polygon(
    0 0, 100% 0, 100% 60%, 50% 100%, 0 60%
  );
}

button {
  min-height: 46px;
  padding: 11px 16px;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  font-size: 17px;
  font-weight: bold;
  margin: 4px;
}

button:hover { filter: brightness(1.12); }

button:focus-visible, input:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 3px;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.green { background: var(--green); color: white; }
.orange { background: var(--orange); color: #182e37; }
.red { background: var(--red); color: white; }
.gray { background: #dce8e8; color: #12334a; }

.controls { text-align: center; }

.score-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
}

.score-controls button { min-width: 50px; }

.field {
  margin: 12px 0;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

input[type=text] {
  width: 100%;
  padding: 12px;
  font-size: 17px;
  border-radius: 8px;
  border: 1px solid #829ba5;
}

.status {
  color: #f3c773;
  min-height: 30px;
  text-align: center;
}

.note {
  color: #bbd0d7;
  font-size: 15px;
  line-height: 1.6;
}

@media(max-width: 750px) {
  .grid { grid-template-columns: 1fr; }
  .container { padding: 12px; }
  h1 { font-size: 26px; }
}

@media(max-width: 360px) {
  .panel { padding: 13px; }
  .team { font-size: 20px; }
  .score { font-size: 44px; }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<div class="container">

<h1>⚾ 棒球比賽計分板</h1>

<div class="grid">

  <!-- 比分顯示 -->
  <section class="panel">
    <h2>比賽資訊</h2>

    <div class="inning" id="inning">
      第 1 局 上半局
    </div>

    <div class="team">
      <span id="awayName">客隊</span>
      <span class="score" id="awayScore">0</span>
    </div>

    <div class="team">
      <span id="homeName">主隊</span>
      <span class="score" id="homeScore">0</span>
    </div>

    <p class="batting" id="batting">
      目前進攻：客隊
    </p>
  </section>

  <!-- BSO 顯示 -->
  <section class="panel">
    <h2>好壞球及出局數</h2>

    <div class="count-row">
      <strong>壞球 B</strong>
      <div class="lights" id="balls"></div>
    </div>

    <div class="count-row">
      <strong>好球 S</strong>
      <div class="lights" id="strikes"></div>
    </div>

    <div class="count-row">
      <strong>出局 O</strong>
      <div class="lights" id="outs"></div>
    </div>
  </section>

  <!-- 壘包 -->
  <section class="panel">
    <h2>壘包狀況</h2>
    <p class="note">
      點擊壘包可以切換跑者占壘狀態。
    </p>

    <div class="diamond">
      <button class="base second" id="base2"
        aria-label="二壘" aria-pressed="false">
        <span>二壘</span>
      </button>

      <button class="base first" id="base1"
        aria-label="一壘" aria-pressed="false">
        <span>一壘</span>
      </button>

      <button class="base third" id="base3"
        aria-label="三壘" aria-pressed="false">
        <span>三壘</span>
      </button>

      <div class="homeplate">本壘</div>
    </div>
  </section>

  <!-- 操作 -->
  <section class="panel">
    <h2>比賽操作</h2>

    <div class="controls">
      <button class="green" onclick="addBall()">
        ＋壞球
      </button>

      <button class="orange" onclick="addStrike()">
        ＋好球
      </button>

      <button class="red" onclick="addOut()">
        ＋出局
      </button>

      <button class="gray" onclick="resetCount()">
        清除球數
      </button>
    </div>

    <p class="note">
      四壞球自動保送，三好球記一出局。
      不死三振等特殊情況請手動調整。
    </p>

    <h2>局數控制</h2>
    <div class="controls">
      <button class="gray" onclick="nextHalf()">
        切換半局
      </button>

      <button class="gray" id="undoBtn" onclick="undo()">
        復原上一步
      </button>
    </div>
  </section>

  <!-- 分數 -->
  <section class="panel">
    <h2>比分調整</h2>

    <div class="score-controls">
      <strong id="awayControl">客隊</strong>
      <div>
        <button class="gray"
          onclick="changeScore('away',-1)">－</button>
        <button class="green"
          onclick="changeScore('away',1)">＋</button>
      </div>
    </div>

    <div class="score-controls">
      <strong id="homeControl">主隊</strong>
      <div>
        <button class="gray"
          onclick="changeScore('home',-1)">－</button>
        <button class="green"
          onclick="changeScore('home',1)">＋</button>
      </div>
    </div>

    <div class="field">
      <label for="awayInput">客隊名稱</label>
      <input type="text" id="awayInput"
        maxlength="30" value="客隊">
    </div>

    <div class="field">
      <label for="homeInput">主隊名稱</label>
      <input type="text" id="homeInput"
        maxlength="30" value="主隊">
    </div>
  </section>

  <!-- 紀錄 -->
  <section class="panel">
    <h2>比賽紀錄管理</h2>

    <div class="controls">
      <button class="green" onclick="exportGame()">
        匯出紀錄
      </button>

      <button class="gray"
        onclick="document.getElementById('fileInput').click()">
        匯入紀錄
      </button>

      <button class="red" onclick="newGame()">
        重新開始
      </button>
    </div>

    <input type="file" id="fileInput"
      accept=".json,application/json"
      style="position:absolute;width:1px;height:1px;
      opacity:0;pointer-events:none">

    <p class="note">
      比賽資料可匯出為 JSON 檔案。
      本網頁不會自動將資料傳送到伺服器，
      重新整理前請先匯出備份。
    </p>
  </section>

</div>

<p class="status" id="status"
  role="status" aria-live="polite"></p>

</div>

<script>
"use strict";

// 初始比賽資料
function initialGame() {
  return {
    version: 1,
    inning: 1,
    half: "top",
    away: "客隊",
    home: "主隊",
    awayScore: 0,
    homeScore: 0,
    balls: 0,
    strikes: 0,
    outs: 0,
    bases: [false, false, false]
  };
}

let game = initialGame();
let history = [];

function el(id) {
  return document.getElementById(id);
}

function clone(data) {
  return JSON.parse(JSON.stringify(data));
}

function saveHistory() {
  history.push(clone(game));
  if (history.length > 100) history.shift();
}

function message(text) {
  el("status").textContent = text;
}

function update(action, text) {
  saveHistory();
  action();
  render();
  message(text);
}

// 畫好壞球與出局燈號
function drawLights(id, count, max, type) {
  const box = el(id);
  box.replaceChildren();

  for (let i = 0; i < max; i++) {
    const dot = document.createElement("span");
    dot.className =
      "light " + type + (i < count ? " on" : "");
    dot.setAttribute("aria-hidden", "true");
    box.appendChild(dot);
  }

  const labels = {
    ball: "壞球",
    strike: "好球",
    out: "出局"
  };

  box.setAttribute(
    "aria-label",
    count + " " + labels[type]
  );
}

// 更新畫面
function render() {
  el("inning").textContent =
    "第 " + game.inning + " 局 " +
    (game.half === "top" ? "上半局" : "下半局");

  el("awayName").textContent = game.away;
  el("homeName").textContent = game.home;
  el("awayScore").textContent = game.awayScore;
  el("homeScore").textContent = game.homeScore;

  el("awayControl").textContent = game.away;
  el("homeControl").textContent = game.home;

  el("batting").textContent =
    "目前進攻：" +
    (game.half === "top" ? game.away : game.home);

  drawLights("balls", game.balls, 3, "ball");
  drawLights("strikes", game.strikes, 2, "strike");
  drawLights("outs", game.outs, 2, "out");

  for (let i = 0; i < 3; i++) {
    const base = el("base" + (i + 1));
    const occupied = game.bases[i];

    base.classList.toggle("active", occupied);
    base.setAttribute("aria-pressed", String(occupied));

    const names = ["一壘", "二壘", "三壘"];
    base.setAttribute(
      "aria-label",
      names[i] + (occupied ? "有跑者" : "無跑者")
    );
  }

  el("undoBtn").disabled = history.length === 0;

  if (document.activeElement !== el("awayInput")) {
    el("awayInput").value = game.away;
  }
  if (document.activeElement !== el("homeInput")) {
    el("homeInput").value = game.home;
  }
}

// 切換半局
function performNextHalf() {
  game.balls = 0;
  game.strikes = 0;
  game.outs = 0;
  game.bases = [false, false, false];

  if (game.half === "top") {
    game.half = "bottom";
  } else {
    game.half = "top";
    game.inning++;
  }
}

function nextHalf() {
  update(performNextHalf, "已切換半局");
}

// 記錄出局
function performOut() {
  game.outs++;
  game.balls = 0;
  game.strikes = 0;

  if (game.outs >= 3) {
    performNextHalf();
  }
}

function addOut() {
  update(performOut, "已記錄出局");
}

// 四壞保送，依強迫進壘規則推進
function performWalk() {
  const [first, second, third] = game.bases;

  if (first && second && third) {
    if (game.half === "top") {
      game.awayScore++;
    } else {
      game.homeScore++;
    }
  }

  game.bases = [
    true,
    first || second,
    third || (first && second)
  ];

  game.balls = 0;
  game.strikes = 0;
}

function addBall() {
  update(() => {
    game.balls++;

    if (game.balls >= 4) {
      performWalk();
    }
  }, "已記錄壞球");
}

function addStrike() {
  update(() => {
    game.strikes++;

    if (game.strikes >= 3) {
      performOut();
    }
  }, "已記錄好球");
}

function resetCount() {
  update(() => {
    game.balls = 0;
    game.strikes = 0;
  }, "已清除好壞球");
}

// 點擊壘包
function toggleBase(index) {
  update(() => {
    game.bases[index] = !game.bases[index];
  }, "壘包狀態已更新");
}

for (let i = 1; i <= 3; i++) {
  el("base" + i).addEventListener("click", () => {
    toggleBase(i - 1);
  });
}

// 修改比分
function changeScore(team, amount) {
  const key = team + "Score";

  if (game[key] + amount < 0) {
    message("比分不能低於 0");
    return;
  }

  update(() => {
    game[key] += amount;
  }, "比分已更新");
}

// 修改隊名
["away", "home"].forEach(team => {
  el(team + "Input").addEventListener("change", e => {
    const name = e.target.value.trim();

    if (!name) {
      e.target.value = game[team];
      message("隊名不可空白");
      return;
    }

    if (name === game[team]) return;

    update(() => {
      game[team] = name;
    }, "隊名已更新");
  });
});

// 復原
function undo() {
  if (history.length === 0) return;

  game = history.pop();
  render();
  message("已復原上一步");
}

// 重新開始
function newGame() {
  const ok = confirm(
    "確定要清除目前的比賽紀錄並重新開始嗎？"
  );

  if (!ok) return;

  saveHistory();
  game = initialGame();
  render();
  message("已開始新比賽，可復原");
}

// 匯出 JSON
function exportGame() {
  const content = JSON.stringify(game, null, 2);

  const blob = new Blob([content], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "棒球比賽紀錄.json";
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
  message("比賽紀錄已匯出");
}

// 驗證匯入資料
function isValid(data) {
  if (
    !data ||
    typeof data !== "object" ||
    Array.isArray(data)
  ) return false;

  if (data.version !== 1) return false;

  if (
    !Number.isSafeInteger(data.inning) ||
    data.inning < 1 ||
    data.inning > 999
  ) return false;

  if (!["top", "bottom"].includes(data.half)) {
    return false;
  }

  for (const key of ["away", "home"]) {
    if (
      typeof data[key] !== "string" ||
      !data[key].trim() ||
      data[key].length > 30
    ) return false;
  }

  for (const key of ["awayScore", "homeScore"]) {
    if (
      !Number.isSafeInteger(data[key]) ||
      data[key] < 0 ||
      data[key] > 99999
    ) return false;
  }

  const limits = {
    balls: 3,
    strikes: 2,
    outs: 2
  };

  for (const [key, max] of Object.entries(limits)) {
    if (
      !Number.isInteger(data[key]) ||
      data[key] < 0 ||
      data[key] > max
    ) return false;
  }

  return (
    Array.isArray(data.bases) &&
    data.bases.length === 3 &&
    data.bases.every(x => typeof x === "boolean")
  );
}

// 匯入 JSON
el("fileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";

  if (!file) return;

  if (file.size > 100000) {
    message("匯入失敗：檔案不可超過 100 KB");
    return;
  }

  try {
    const data = JSON.parse(await file.text());

    if (!isValid(data)) {
      throw new Error("檔案格式或資料不正確");
    }

    const ok = confirm(
      "確定匯入紀錄？目前資料將被取代。"
    );

    if (!ok) return;

    saveHistory();

    game = {
      version: 1,
      inning: data.inning,
      half: data.half,
      away: data.away.trim(),
      home: data.home.trim(),
      awayScore: data.awayScore,
      homeScore: data.homeScore,
      balls: data.balls,
      strikes: data.strikes,
      outs: data.outs,
      bases: [...data.bases]
    };

    render();
    message("匯入成功");
  } catch (error) {
    message("匯入失敗：" + error.message);
  }
});

// 啟動畫面
render();
</script>

</body>
</html>
